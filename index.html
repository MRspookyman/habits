<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habits</title>
  <meta name="description" content="Tu diario de hábitos, entrenamientos y progreso.">
  <meta name="theme-color" content="#f7f8f3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Tema antes de pintar (misma regla que js/theme.js), para que no haya destello.
    (() => {
      const pref = localStorage.getItem("habits.theme") || "auto";
      const dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/dark.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <div class="shell">
    <aside id="rail" aria-label="Barra lateral"></aside>
    <div class="workspace">
      <header id="mobile-head"></header>
      <main id="main" tabindex="-1"></main>
    </div>
    <nav id="mobile-nav" aria-label="Navegación principal"></nav>
  </div>
  <noscript>Habits necesita JavaScript.</noscript>
</body>
</html>
